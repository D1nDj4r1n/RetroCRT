# retrocrt — tmux adapter
# Canonical palette: ../../palette
#
# Source from ~/.tmux.conf (do not replace the rest of that file):
#   source-file ~/.config/retrocrt/adapters/tmux/retrocrt.conf
#
# Colors + status-left battery + status-right date.
# Does not set prefix, keybinds, or plugins.

# Hex styles need RGB from the terminal (Ghostty). Append, do not replace.
set -as terminal-features ",*:RGB"

# --- Surfaces ---------------------------------------------------------------
# Status bar is a secondary surface (BACKGROUND_ALT).
set -g status-style "fg=#c8d0d8,bg=#121820"
set -g status-left-style "fg=#c8d0d8,bg=#121820"
set -g status-right-style "fg=#4080c0,bg=#121820"
set -g status-interval 15
set -g status-left-length 20
set -g status-right-length 20

# Battery left, date right. Windows stay in the remaining space.
set -g status-left " #($HOME/.config/retrocrt/adapters/tmux/battery) "
set -g status-right " #[fg=#4080c0]%Y-%m-%d %H:%M "

# --- Windows: active = NORMAL/CYAN ------------------------------------------
set -g window-status-style "fg=#5a6570,bg=#121820"
set -g window-status-current-style "fg=#0a0e14,bg=#00d4c8"
set -g window-status-last-style "fg=#00d4c8,bg=#121820"
set -g window-status-activity-style "fg=#ffb020,bg=#121820"
set -g window-status-bell-style "fg=#e05050,bg=#121820"

# --- Panes ------------------------------------------------------------------
# Inactive DIM. Active CYAN. Copy-mode MAGENTA (VISUAL). Sync AMBER (attention).
set -g pane-border-style "fg=#5a6570,bg=#0a0e14"
set -g pane-active-border-style "#{?pane_in_mode,fg=#e040a0,#{?pane_synchronized,fg=#ffb020,fg=#00d4c8}},bg=#0a0e14"
set -g display-panes-active-colour "#00d4c8"
set -g display-panes-colour "#4080c0"

# --- CRT status language ----------------------------------------------------
# Command prompt / messages = INSERT (editable, pending) = AMBER
set -g message-style "fg=#0a0e14,bg=#ffb020"
set -g message-command-style "fg=#0a0e14,bg=#ffb020"

# Copy-mode selection = VISUAL = VISUAL_BG / MAGENTA
set -g mode-style "fg=#c8d0d8,bg=#1e3a4c"
set -g copy-mode-match-style "fg=#0a0e14,bg=#ffb020"
set -g copy-mode-current-match-style "fg=#0a0e14,bg=#00d4c8"
set -g copy-mode-mark-style "fg=#0a0e14,bg=#e040a0"

# Clock is informational = BLUE
set -g clock-mode-colour "#4080c0"

# Menus / popups
set -g popup-style "fg=#c8d0d8,bg=#121820"
set -g popup-border-style "fg=#5a6570"
set -g menu-style "fg=#c8d0d8,bg=#121820"
set -g menu-selected-style "fg=#0a0e14,bg=#00d4c8"
set -g menu-border-style "fg=#5a6570"
