# retrocrt — tmux power status line (optional)
# Canonical palette: ../../palette
#
# A powerline status line in the spirit of wfxr/tmux-power, rebuilt on the
# retrocrt palette and the CRT status language. Source it AFTER retrocrt.conf
# in ~/.tmux.conf (it only replaces the status line; panes, messages and
# copy-mode stay with retrocrt.conf):
#   source-file ~/.config/retrocrt/adapters/tmux/retrocrt.conf
#   source-file ~/.config/retrocrt/adapters/tmux/power.conf
#
# Plain tmux formats: no script, no plugin manager, no run-shell at load.
# Sections are read when the bar is drawn, so @retrocrt_power_* may be set
# before or after this file (set -o below keeps a value that is already set).
# Does not set prefix, keybinds, plugins, or fonts. The default separators are
# Powerline glyphs (any Nerd Font); set them to '' for flat blocks.
# Same file on Arch Linux and FreeBSD; tmux >= 3.4.
#
#   +------+---+---+---+-------- windows --------+---+---+---+---+
#   | MODE | B | C | D |  1:zsh   2:nvim  3:yazi  | W | X | Y | Z |
#   +------+---+---+---+-------------------------+---+---+---+---+
#
# Surfaces, outer to inner (palette roles, no new hues):
#   mode pill  NORMAL CYAN · PREFIX/key table AMBER · COPY/VIEW MAGENTA · SYNC AMBER
#   B, Y       VISUAL_BG       #1e3a4c   raised segment
#   C, D, W, X BACKGROUND_ALT  #121820   inner segment
#   bar        BACKGROUND      #0a0e14
#   Z          BLUE            #4080c0   date (informational)

# --- CRT status language ----------------------------------------------------
# A key table other than the default is pending input (INSERT/AMBER, like the
# swaybar binding mode): PREFIX, or the name of a table entered with
# switch-client -T. tmux sets client_prefix for any such table.
# A pane in a mode is VISUAL/MAGENTA: COPY for copy-mode, VIEW for the rest
# (view-mode, choose-tree, clock). Synchronized panes are attention (AMBER).
set -goq @retrocrt_power_mode "#{?client_prefix,#{?#{==:#{client_key_table},prefix},PREFIX,#{client_key_table}},#{?pane_in_mode,#{?#{==:#{pane_mode},copy-mode},COPY,VIEW},#{?pane_synchronized,SYNC,NORMAL}}}"
set -goq @retrocrt_power_mode_color "#{?client_prefix,#ffb020,#{?pane_in_mode,#e040a0,#{?pane_synchronized,#ffb020,#00d4c8}}}"

# --- Battery: laptop / PC ---------------------------------------------------
# Shared with retrocrt.conf. Arch reads sysfs, FreeBSD sysctl.
#   on    laptop: always shown, "BAT --" if no battery is found
#   off   PC: never shown, never read
#   auto  shown only if the machine has a battery (default)
set -goq @retrocrt_battery auto

# --- Sections (tmux formats; '' hides a section) -----------------------------
# Left: mode pill, then B → D. Right: W → Z, Z outermost. Battery left, date right.
# A section that renders empty is hidden too, so C disappears on a PC.
set -goq @retrocrt_power_left_b  "#S"
set -goq @retrocrt_power_left_c  "#{?#{==:#{@retrocrt_battery},off},,#($HOME/.config/retrocrt/adapters/tmux/battery #{@retrocrt_battery})}"
set -goq @retrocrt_power_left_d  ""
set -goq @retrocrt_power_right_w ""
set -goq @retrocrt_power_right_x ""
set -goq @retrocrt_power_right_y "%H:%M"
set -goq @retrocrt_power_right_z "%Y-%m-%d"
set -goq @retrocrt_power_window  "#I:#W#F"

# Separators: solid between surfaces, thin between two segments on the same one.
# Powerline code points as tmux \u escapes: no glyphs in this file. A client
# without UTF-8 (console, LANG=C) gets flat blocks and '|' instead of '_'.
set -goq @retrocrt_power_sep_right      "#{?client_utf8,\ue0b0,}"
set -goq @retrocrt_power_sep_left       "#{?client_utf8,\ue0b2,}"
set -goq @retrocrt_power_sep_right_thin "#{?client_utf8,\ue0b1,|}"
set -goq @retrocrt_power_sep_left_thin  "#{?client_utf8,\ue0b3,|}"

# Shown = the section renders non-empty. Internal; not meant to be set.
set -g @retrocrt_power_show_b "#{!=:#{T:@retrocrt_power_left_b},}"
set -g @retrocrt_power_show_c "#{!=:#{T:@retrocrt_power_left_c},}"
set -g @retrocrt_power_show_d "#{!=:#{T:@retrocrt_power_left_d},}"
set -g @retrocrt_power_show_w "#{!=:#{T:@retrocrt_power_right_w},}"
set -g @retrocrt_power_show_x "#{!=:#{T:@retrocrt_power_right_x},}"
set -g @retrocrt_power_show_y "#{!=:#{T:@retrocrt_power_right_y},}"
set -g @retrocrt_power_show_z "#{!=:#{T:@retrocrt_power_right_z},}"

# --- Bar --------------------------------------------------------------------
set -g status-style "fg=#c8d0d8,bg=#0a0e14"
set -g status-left-style "fg=#c8d0d8,bg=#0a0e14"
set -g status-right-style "fg=#c8d0d8,bg=#0a0e14"
set -g status-left-length 100
set -g status-right-length 100

# --- status-left: MODE → B → C → D → bar --------------------------------------
# Each segment ends with the separator into the next shown segment, so empty
# sections drop out without a stray arrow.
set -g  status-left ""
# MODE: BACKGROUND on the mode color, bold. Always shown.
set -ag status-left "#[fg=#0a0e14,bg=#{E:@retrocrt_power_mode_color},bold] #{E:@retrocrt_power_mode} #[none]"
set -ag status-left "#[fg=#{E:@retrocrt_power_mode_color}]#[bg=#{?#{E:@retrocrt_power_show_b},#1e3a4c,#{?#{||:#{E:@retrocrt_power_show_c},#{E:@retrocrt_power_show_d}},#121820,#0a0e14}}]#{E:@retrocrt_power_sep_right}"
# B: FOREGROUND on VISUAL_BG.
set -ag status-left "#{?#{E:@retrocrt_power_show_b},#[fg=#c8d0d8]#[bg=#1e3a4c] #{T:@retrocrt_power_left_b} #[fg=#1e3a4c]#[bg=#{?#{||:#{E:@retrocrt_power_show_c},#{E:@retrocrt_power_show_d}},#121820,#0a0e14}]#{E:@retrocrt_power_sep_right},}"
# C: FOREGROUND on BACKGROUND_ALT (the battery colors its own text).
set -ag status-left "#{?#{E:@retrocrt_power_show_c},#[fg=#c8d0d8]#[bg=#121820] #{T:@retrocrt_power_left_c} #{?#{E:@retrocrt_power_show_d},#[fg=#5a6570]#{E:@retrocrt_power_sep_right_thin},#[fg=#121820]#[bg=#0a0e14]#{E:@retrocrt_power_sep_right}},}"
# D: FOREGROUND on BACKGROUND_ALT.
set -ag status-left "#{?#{E:@retrocrt_power_show_d},#[fg=#c8d0d8]#[bg=#121820] #{T:@retrocrt_power_left_d} #[fg=#121820]#[bg=#0a0e14]#{E:@retrocrt_power_sep_right},}"

# --- status-right: bar → W → X → Y → Z ----------------------------------------
# Each segment starts with the separator out of the previous shown segment.
set -g  status-right ""
# W: FOREGROUND on BACKGROUND_ALT.
set -ag status-right "#{?#{E:@retrocrt_power_show_w},#[fg=#121820]#[bg=#0a0e14]#{E:@retrocrt_power_sep_left}#[fg=#c8d0d8]#[bg=#121820] #{T:@retrocrt_power_right_w} ,}"
# X: FOREGROUND on BACKGROUND_ALT; thin separator after W.
set -ag status-right "#{?#{E:@retrocrt_power_show_x},#{?#{E:@retrocrt_power_show_w},#[fg=#5a6570]#[bg=#121820]#{E:@retrocrt_power_sep_left_thin},#[fg=#121820]#[bg=#0a0e14]#{E:@retrocrt_power_sep_left}}#[fg=#c8d0d8]#[bg=#121820] #{T:@retrocrt_power_right_x} ,}"
# Y: FOREGROUND on VISUAL_BG.
set -ag status-right "#{?#{E:@retrocrt_power_show_y},#[fg=#1e3a4c]#[bg=#{?#{||:#{E:@retrocrt_power_show_w},#{E:@retrocrt_power_show_x}},#121820,#0a0e14}]#{E:@retrocrt_power_sep_left}#[fg=#c8d0d8]#[bg=#1e3a4c] #{T:@retrocrt_power_right_y} ,}"
# Z: BACKGROUND on BLUE, bold. Date is informational.
set -ag status-right "#{?#{E:@retrocrt_power_show_z},#[fg=#4080c0]#[bg=#{?#{E:@retrocrt_power_show_y},#1e3a4c,#{?#{||:#{E:@retrocrt_power_show_w},#{E:@retrocrt_power_show_x}},#121820,#0a0e14}}]#{E:@retrocrt_power_sep_left}#[fg=#0a0e14]#[bg=#4080c0]#[bold] #{T:@retrocrt_power_right_z} #[none],}"

# --- Windows ----------------------------------------------------------------
# Inactive: BACKGROUND_ALT block. Text DIM; last CYAN; activity/silence AMBER;
# bell RED on DIFF_DELETE_BG (as the swaybar urgent workspace).
# Current: BACKGROUND on the mode color, bold — focus shows the mode too.
set -g window-status-separator ""
# The formats carry every color; the base styles only drop tmux's defaults
# (reverse on activity/bell, underscore on the current window since 3.8).
set -g window-status-style "none"
set -g window-status-current-style "none"
set -g window-status-last-style "none"
set -g window-status-activity-style "none"
set -g window-status-bell-style "none"
set -g window-status-format "#[fg=#0a0e14]#[bg=#{?window_bell_flag,#201212,#121820}]#{E:@retrocrt_power_sep_right}#[fg=#{?window_bell_flag,#e05050,#{?#{||:#{window_activity_flag},#{window_silence_flag}},#ffb020,#{?window_last_flag,#00d4c8,#5a6570}}}] #{E:@retrocrt_power_window} #[fg=#{?window_bell_flag,#201212,#121820}]#[bg=#0a0e14]#{E:@retrocrt_power_sep_right}"
set -g window-status-current-format "#[fg=#0a0e14,bg=#{E:@retrocrt_power_mode_color}]#{E:@retrocrt_power_sep_right}#[fg=#0a0e14,bold] #{E:@retrocrt_power_window} #[none]#[fg=#{E:@retrocrt_power_mode_color},bg=#0a0e14]#{E:@retrocrt_power_sep_right}"
