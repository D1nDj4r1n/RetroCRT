# retrocrt — kitty adapter (main terminal on every device)
# Canonical palette: ../../palette
# Install to ~/.config/kitty/themes/retrocrt.conf
# Enable with one line in ~/.config/kitty/kitty.conf (paths are relative to
# the kitty config directory):
#   include themes/retrocrt.conf
# or pick "retrocrt" under User in: kitty +kitten themes
# Colors only. Do not put font, padding, opacity, shell integration, or
# window behavior in this file.

## name: retrocrt
## blurb: CRT palette: dark blue-black, cool gray, cyan, amber.

foreground #c8d0d8
background #0a0e14
selection_foreground #c8d0d8
selection_background #1e3a4c

# NORMAL / CYAN cursor
cursor #00d4c8
cursor_text_color #0a0e14

# Links are informational, as Underlined in the Neovim adapter
url_color #4080c0

# Window borders (splits): active CYAN, inactive DIM, bell RED
active_border_color #00d4c8
inactive_border_color #5a6570
bell_border_color #e05050
visual_bell_color #201212

# Tab bar, as the swaybar: bar BACKGROUND, active CYAN, inactive
# BACKGROUND_ALT with DIM text
tab_bar_background #0a0e14
active_tab_foreground #0a0e14
active_tab_background #00d4c8
inactive_tab_foreground #5a6570
inactive_tab_background #121820

# Marks (kitty's text highlighting): attention AMBER, active CYAN,
# selection MAGENTA, as tmux copy-mode match / current match / mark
mark1_foreground #0a0e14
mark1_background #ffb020
mark2_foreground #0a0e14
mark2_background #00d4c8
mark3_foreground #0a0e14
mark3_background #e040a0

# ANSI 0-7
color0 #0a0e14
color1 #e05050
color2 #40c070
color3 #ffb020
color4 #4080c0
color5 #e040a0
color6 #00d4c8
color7 #c8d0d8

# ANSI 8-15 (derived brights, same hues)
color8 #5a6570
color9 #e67373
color10 #66cd8d
color11 #ffc04d
color12 #6699cd
color13 #e666b3
color14 #33ddd3
color15 #d8e0e8
